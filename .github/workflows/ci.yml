# ☰☰☰ CI — quality gates on every push/PR to main ☰☰☰
# Job `gate`: the full local gate suite — typecheck (incl. tests), unit tests, comment
#   gate, CSS gate, docs gate, release-config gate, format check, prod build.
# Job `e2e`: behavioral tests in a real Firefox — synthetic fixture pages are committed
#   (no privacy screening needed), so E2E runs in CI here (unlike youtube-ui-tweaks,
#   where captured YouTube DOM must stay local — see ADR 0004).
# Job `secrets`: gitleaks over the full history; read-only token, no PR comments.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─── Concurrency — cancel superseded PR runs; never cancel a main push ───
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ─── Permissions — minimal, read-only ───
permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: check / test / comments / css / docs / release / format / build
    runs-on: ubuntu-latest
    steps:
      # LABEL: checkout + Node 22 with npm cache
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # LABEL: the gates (order = fail-fast: cheapest first)
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run comments:check -- --strict
      - run: npm run css:check -- --strict
      - run: npm run docs:check
      - run: npm run release:check
      - run: npm run format:check
      - run: npm run build

  e2e:
    name: e2e (Firefox, effective URL behavior)
    runs-on: ubuntu-latest
    steps:
      # LABEL: checkout + Node 22 with npm cache
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # LABEL: build the artifact under test, then run the Playwright suite against it
      - run: npm ci
      - run: npm run build
      - run: npx playwright install firefox --with-deps
      - run: npm run test:e2e

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # LABEL: full history is required to scan every commit reachable from the push/PR
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
